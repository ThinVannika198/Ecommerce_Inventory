{% extends 'backoffice/base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
{% endblock %}

{% block content %}
{% csrf_token %}
{{ products|json_script:"products-data" }}

<!-- TOP BAR -->
<div class="pos-topbar">
    <h2>POS</h2>
    
    <div class="cashier-select-wrapper">
    <label class="cashier-label" for="cashier-select">Select Cashier:</label>
    <select id="cashier-select" class="cashier-dropdown" required>
        <option value="">-- Who is selling? --</option>
        {% for emp in employees %}
            <option value="{{ emp.employeeid }}">{{ emp.employeename }}</option>
        {% endfor %}
    </select>
</div>
    <div class="pos-links">
        <a href="{% url 'orders' %}" class="pos-link">📋 Orders</a>
        <a href="{% url 'customers' %}" class="pos-link">👥 Customers</a>
    </div>
</div>

<div class="pos-layout" id="pos-app" data-checkout-url="{% url 'pos_checkout' %}">

    <!-- LEFT: products -->
    <section class="pos-products">
        <input type="text" id="search" class="pos-search" placeholder="Search product...">
        <div id="product-grid" class="product-grid"></div>
    </section>

    <!-- RIGHT: cart -->
    <aside class="pos-cart">
        <h3>Current Sale</h3>

        <div id="cart-items" class="cart-items"></div>

        <div class="cart-total">
            <span>Total</span>
            <strong id="total">$0.00</strong>
        </div>

        <input type="text" id="cust-name" class="pos-input" placeholder="Customer name (optional)">
        <input type="text" id="cust-phone" class="pos-input" placeholder="Customer phone (optional)">

        <select id="payment" class="pos-input">
            <option value="Cash">Cash</option>
            <option value="Card">Card</option>
            <option value="QR">QR</option>
        </select>

        <div id="cash-box">
            <input type="number" id="received" class="pos-input" min="0" step="0.01" placeholder="Cash received">
            <div class="cart-change">Change: <strong id="change">$0.00</strong></div>
        </div>

        <label class="pos-debt">
            <input type="checkbox" id="allow-debt"> Customer pays the rest later
        </label>
        <div class="cart-change">Balance owed: <strong id="owed">$0.00</strong></div>

        <p id="error" class="pos-error"></p>

        <button id="charge" class="pos-charge" type="button">Charge &amp; Print Receipt</button>
        <button id="clear" class="pos-clear" type="button">Clear</button>
    </aside>

</div>

<!-- JavaScript (must come after the HTML above) -->
<script src="{% static 'backoffice/js/pos.js' %}"></script>
{% endblock %}
