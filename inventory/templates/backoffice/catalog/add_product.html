<!-- add_product.html -->
{% extends 'backoffice/base.html' %}
{% load static %}

{% block content %}
<div class="product-form-container">
    <h2>Add New Product</h2>

    <form method="POST" enctype="multipart/form-data" class="product-form">
        {% csrf_token %}

        {% if form.errors %}
        <div class="form-errors">
            <strong>Errors:</strong> {{ form.errors }}
        </div>
        {% endif %}

        <div class="form-columns">
            <!-- LEFT COLUMN -->
            <div class="left-column">
                <!-- GENERAL INFORMATION -->
                <div class="card">
                    <h3>General Information</h3>

                    <label for="product_no">Product No (ID)</label>
                    <input type="number" id="product_no" name="product_no" required>

                    <label for="productname">Name Product</label>
                    <input type="text" id="productname" name="productname" required
                           placeholder="e.g. Puffer Jacket With Pocket Detail">

                    <label for="description">Description Product</label>
                    <textarea id="description" name="description" rows="4"></textarea>

                    <div class="row">
                        <div class="col">
                            <label for="size">Size</label>
                            <select id="size" name="size">
                                <option value="XS">37</option>
                                <option value="S">38</option>
                                <option value="M">39</option>
                                <option value="L">40</option>
                                <option value="XL">41</option>
                                <option value="XXL">42</option>
                            </select>
                        </div>
                        <div class="col wide">
                            <label>Gender</label>
                            <div class="radio-group">
                                <label><input type="radio" name="gender" value="Men" checked> Men</label>
                                <label><input type="radio" name="gender" value="Woman"> Woman</label>
                                <label><input type="radio" name="gender" value="Unisex"> Unisex</label>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col">
                            <label for="unit_measure">Unit Measure</label>
                            <input type="text" id="unit_measure" name="unit_measure" placeholder="e.g. pcs, box">
                        </div>
                        <div class="col">
                            <label for="reorder_level">Reorder Level</label>
                            <input type="number" id="reorder_level" name="reorder_level">
                        </div>
                    </div>
                </div>

                <!-- PRICING AND STOCK -->
                <div class="card">
                    <h3>Pricing And Stock</h3>

                    <div class="row">
                        <div class="col">
                            <label for="sell_price">Sell Price ($)</label>
                            <input type="number" step="0.01" id="sell_price" name="sell_price" required>
                        </div>
                        <div class="col">
                            <label for="cost_price">Cost Price ($)</label>
                            <input type="number" step="0.01" id="cost_price" name="cost_price" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col">
                            <label for="profit_percent">Profit Percent (%)</label>
                            <input type="number" step="0.01" id="profit_percent" name="profit_percent">
                        </div>
                        <div class="col">
                            <label for="qty_on_hand">Qty On Hand</label>
                            <input type="number" id="qty_on_hand" name="qty_on_hand">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col">
                            <label for="discount">Discount</label>
                            <input type="number" step="0.01" id="discount" name="discount">
                        </div>
                        <div class="col">
                            <label for="discount_type">Discount Type</label>
                            <input type="text" id="discount_type" name="discount_type" placeholder="e.g. percent, fixed">
                        </div>
                    </div>
                </div>
            </div>

            <!-- RIGHT COLUMN -->
            <div class="right-column">
                <div class="card">
                    <h3>Upload Img</h3>
                    <input type="file" name="photo" accept="image/*" class="file-input">
                </div>

                <div class="card">
                    <h3>Category</h3>
                    <label for="producttype">Product Category</label>
                    <select id="producttype" name="producttype">
                        {% for cat in categories %}
                            <option value="{{ cat.pk }}">{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>

                <button type="submit" class="submit-btn">Add Product</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
