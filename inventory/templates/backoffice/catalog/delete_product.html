{% extends 'backoffice/base.html' %}
{% load static %}

{% block content %}
<div class="main-container" style="padding: 30px; background: #0f172a; color: #fff; min-height: 100vh;">
    <div style="max-width: 500px; margin: 60px auto; background: #1e293b; padding: 30px; border-radius: 10px; text-align: center;">
        <h2 style="color: #ef4444;">Delete Product?</h2>
        <p style="color: #94a3b8; margin: 20px 0;">
            Are you sure you want to delete <strong style="color: #fff;">{{ product.productname }}</strong>?
            This cannot be undone.
        </p>

        {% if product.photo %}
            <img src="{{ product.photo.url }}" style="width: 150px; border-radius: 8px; margin-bottom: 20px;">
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <button type="submit"
                    style="padding: 12px 24px; background: #ef4444; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">
                Yes, Delete
            </button>
            <a href="{% url 'products' %}"
               style="display: inline-block; margin-left: 10px; padding: 12px 24px; background: #64748b; color: white; border-radius: 5px; text-decoration: none;">
               Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
