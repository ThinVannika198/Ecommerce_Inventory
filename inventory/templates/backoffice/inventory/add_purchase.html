{% extends 'backoffice/base.html' %}
{% load static %}

{% block content %}
<div class="stock-container" style="max-width: 600px; margin: 40px auto;">
    <h2>Add New Purchase (Restock)</h2>
    <p style="color: #9ca3af; margin-bottom: 20px;">Record a purchase from a supplier to increase your stock.</p>

    <form method="POST" class="form-card">
        {% csrf_token %}
        
        <div class="form-group">
            <label>Supplier</label>
            <select name="supplier" class="form-control" required>
                <option value="">-- Select Supplier --</option>
                {% for s in suppliers %}
                    <option value="{{ s.supplier_no }}">{{ s.suppliername }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Product to Buy</label>
            <select name="product" class="form-control" required>
                <option value="">-- Select Product --</option>
                {% for p in products %}
                    <option value="{{ p.product_no }}">{{ p.productname }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Quantity</label>
            <input type="number" name="qty" min="1" required class="form-control" placeholder="How many did you buy?">
        </div>

        <div class="form-group">
            <label>Cost Price per Item ($)</label>
            <input type="number" step="0.01" name="cost" required class="form-control" placeholder="e.g. 15.00">
        </div>

        <button type="submit" class="btn-primary" style="width: 100%;">Record Purchase</button>
    </form>
</div>
{% endblock %}
