<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Successful - Your Brand</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .success-box { background: #1e1e1e; padding: 40px; border-radius: 8px; text-align: center; max-width: 500px; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #4caf50; margin-bottom: 10px; font-size: 28px; }
        p { color: #aaa; font-size: 16px; margin-bottom: 30px; line-height: 1.5; }
        .btn-home { background: #fff; color: #000; padding: 12px 30px; text-decoration: none; font-weight: bold; border-radius: 4px; display: inline-block; transition: background 0.2s; }
        .btn-home:hover { background: #e0e0e0; }
    </style>
</head>
<body>

    <div class="success-box">
        <h1>Order Successful!</h1>
        <p>Thank you for your purchase. Your invoice has been generated, and your order is now being processed.</p>
        <a href="{% url 'home' %}" class="btn-home">Continue Shopping</a>
    </div>

</body>
</html>
