{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account</title>
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>
<div class="auth-card">
    <h1>Create account</h1>

    {% if errors %}
    <ul class="auth-error">
        {% for e in errors %}<li>{{ e }}</li>{% endfor %}
    </ul>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">

        <label for="full_name">Full name</label>
        <input type="text" id="full_name" name="full_name" value="{{ form.full_name }}" required autofocus>

        <label for="phone">Phone number</label>
        <input type="text" id="phone" name="phone" value="{{ form.phone }}" required>

        <label for="email">Email (optional)</label>
        <input type="email" id="email" name="email" value="{{ form.email }}">

        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="{{ form.username }}" minlength="3" required>

        <label for="password">Password (min 8 characters)</label>
        <input type="password" id="password" name="password" minlength="8" required>

        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" name="confirm" minlength="8" required>

        <button type="submit">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="{% url 'login' %}">Sign in</a></p>
    <p class="auth-switch"><a href="{% url 'home' %}">← Back to shop</a></p>
</div>
</body>
</html>
